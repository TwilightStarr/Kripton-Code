[versions]
agp = "9.4.1"
kotlin = "2.2.21"
composeBom = "2025.06.00"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigationCompose = "2.8.4"
coroutines = "1.11.0"
room = "2.8.5"
datastore = "1.1.1"
okhttp = "4.12.0"
serialization = "1.7.3"
work = "2.10.0"
junit = "4.13.2"
ksp = "2.3.6"
robolectric = "4.17"
androidxTest = "1.6.1"
androidxTestExt = "1.2.1"
googleIdentity = "21.2.0"
# 0.35.0: kotlin-stdlib 2.1.21 ile derlenmiş (projenin Kotlin 2.2.x derleyicisiyle uyumlu). 0.4x+ Kotlin 2.4 ister.
markdownRenderer = "0.35.0"
glance = "1.1.1"
acra = "5.12.0"  # 5.13+ Kotlin 2.4 + compileSdk 37 ister; proje Kotlin 2.2 / SDK 35 kullanıyor
leakcanary = "2.14"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-sse = { module = "com.squareup.okhttp3:okhttp-sse", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-webkit = { module = "androidx.webkit:webkit", version = "1.12.1" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# Markdown + sözdizimi renklendirme (Highlights, -code modülüyle birlikte gelir)
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
markdown-renderer-code = { module = "com.mikepenz:multiplatform-markdown-renderer-code", version.ref = "markdownRenderer" }
# Ana ekran widget'ı (Jetpack Glance)
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
# Yerel çökme günlüğü (ağ göndericisi YOK; bkz. data/crash)
acra-core = { module = "ch.acra:acra-core", version.ref = "acra" }
# Yalnız debug: bellek sızıntısı tespiti
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }
# Google Identity Services — Authorization API (GIS)
google-identity-authorization = { module = "com.google.android.gms:play-services-auth", version.ref = "googleIdentity" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
