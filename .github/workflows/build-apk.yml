name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Yalnız aynı PR'ın eski çalışmaları iptal edilir. main'e yapılan push'lar birbirini
# iptal etmez ("Canceling since a higher priority waiting request..." hatası bundan çıkıyordu).
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BASE_VERSION: "0.1"   # major.minor; patch = toplam commit sayısı (otomatik artar)

jobs:
  # Kod biçimi: ktlint CLI (Gradle/Kotlin sürümünden bağımsız). Şimdilik yalnız RAPORLAR, derlemeyi durdurmaz:
  # ilk koşudan sonra `ktlint --baseline=ktlint-baseline.xml --relative "app/src/**/*.kt"` ile taban çizgisi
  # üretip `continue-on-error` satırını kaldırın.
  ktlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write   # main'e push'ta otomatik biçimlendirme commit'i için
    steps:
      - uses: actions/checkout@v7
      - name: ktlint kur
        env:
          KTLINT_VERSION: "1.8.0"
        run: |
          curl -sSLO "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x ktlint
      # main'e push'ta kod biçimi OTOMATİK düzeltilir ve geri commit edilir (GITHUB_TOKEN push'ları yeni
      # çalışma tetiklemez, döngü olmaz). Sonraki push'ta derleme biçimlenmiş kodla çalışır.
      - name: Otomatik biçimlendir ve commit'le
        if: github.event_name == 'push'
        run: |
          ./ktlint --format --relative "app/src/**/*.kt" "*.kts" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app *.kts
          if git diff --cached --quiet; then
            echo "Biçim zaten temiz."
          else
            git commit -m "style: ktlint ile otomatik biçimlendirme [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}" || echo "Push başarısız (dal ilerlemiş olabilir); sonraki çalışmada denenecek."
          fi
      - name: ktlint çalıştır
        run: |
          BASELINE=""
          [ -f ktlint-baseline.xml ] && BASELINE="--baseline=ktlint-baseline.xml"
          set -o pipefail
          ./ktlint --relative $BASELINE "app/src/**/*.kt" "*.kts" 2>&1 | tee ktlint.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ktlint-hatalari
          path: ktlint.txt
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # main'e push'ta "latest" sürümünü güncellemek için
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # commit sayısı sürüm numarası için gerekli

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Gradle önbelleği (bağımlılıklar + wrapper) bu adımda yönetilir.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.0"

      - name: Wrapper jar yoksa üret
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.7.0
          fi
          chmod +x gradlew

      - name: Sürüm numarasını hesapla
        id: ver
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "name=${BASE_VERSION}.${COUNT}" >> "$GITHUB_OUTPUT"
          echo "code=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "Sürüm: ${BASE_VERSION}.${COUNT} (versionCode ${COUNT})"

      - name: Derle, lint, birim test
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue assembleDebug lintDebug testDebugUnitTest -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ steps.ver.outputs.code }} --stacktrace 2>&1 | tee build.log

      # Hata özeti: 8500 satırlık günlük yerine yalnız hata satırlarını içeren küçük bir dosya.
      - name: Hata özeti çıkar
        if: always()
        run: |
          {
            echo "=== FAILED / What went wrong ==="
            grep -n -A12 -E "^\* What went wrong|FAILED$" build.log | head -300
            echo
            echo "=== Kotlin/Java derleme hataları (e: / error:) ==="
            grep -n -E "^e: |error:" build.log | head -300
            echo
            echo "=== Derleyici uyarıları (w:) ==="
            grep -E "^w: " build.log | sort -u | head -300
            echo
            echo "=== Gradle / Java uyarıları ==="
            grep -n -i -E "warning:|deprecat" build.log | sort -u -k2 | head -200
          } > errors.txt || true
          wc -l errors.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-hatalari
          path: |
            errors.txt
            build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: kripton-cod-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      # main'e her push'ta o sürüme özel yeni bir release açılır (etiket: build-<sürüm>).
      # Önsürüm değil, "Latest" işaretli: repo ana sayfasındaki Releases bölümünde en yeni sürüm doğrudan görünür.
      # Etiket "v" ile başlamadığı için release.yml tetiklenmez. APK adı sürümü içerir.
      # Sabit sürüm için ayrıca: git tag v0.2.0 && git push origin v0.2.0 (release.yml).
      - name: APK dosyasını sürüm numarasıyla adlandır
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          mkdir -p dist
          OUT="dist/KriptonCod-${VERSION}.apk"
          cp "$(ls app/build/outputs/apk/debug/*.apk | head -n 1)" "$OUT"
          ( cd dist && sha256sum "KriptonCod-${VERSION}.apk" > "KriptonCod-${VERSION}.apk.sha256" )
          ls -l dist

      - name: Releases'e yükle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Krypton Code ${{ steps.ver.outputs.name }}
          body: |
            main dalındaki commit'ten otomatik üretilen debug APK.
            Sürüm: ${{ steps.ver.outputs.name }} (versionCode ${{ steps.ver.outputs.code }})
            Commit: ${{ github.sha }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/KriptonCod-${{ steps.ver.outputs.name }}.apk
            dist/KriptonCod-${{ steps.ver.outputs.name }}.apk.sha256
