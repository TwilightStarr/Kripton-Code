name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle önbelleği (bağımlılıklar + wrapper) bu adımda yönetilir.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Wrapper jar yoksa üret
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Derle, lint, birim test
        run: ./gradlew --no-daemon --continue assembleDebug lintDebug testDebugUnitTest --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kripton-cod-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
